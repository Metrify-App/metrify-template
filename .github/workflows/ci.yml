name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Node for husky (make install)
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # /metrify-setup adds the stack's toolchain here (setup-uv, setup-python...)

      - name: Install dependencies
        run: make install

      - name: Format, lint, typecheck, test
        run: make check

      - name: Metrify standard
        run: bash .claude/skills/metrify-quality/scripts/check-standard.sh

  # Docker image, through the shared workflow of Metrify-App/github-workflows.
  # Needs the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets. Uncomment for a repo that ships one.
  # docker:
  #   needs: check
  #   if: github.event_name == 'push'
  #   uses: Metrify-App/github-workflows/.github/workflows/docker-build-push.yml@main
  #   with:
  #     dockerfile: ./Dockerfile
  #   secrets: inherit
